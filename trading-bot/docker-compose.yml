services:
  trading-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      TRADING_LOOP_DIR: /app/trading-loop
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:1337:1337"
    volumes:
      - ./data:/app/data
      # Non-secret, explicit broker-to-data listing mappings.
      - ./config:/app/config:ro
      # Strategies, reports, risiko.py and fehler.db; read-only, the bot never changes them.
      - ./trading-loop:/app/trading-loop:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 2.0
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1337/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
